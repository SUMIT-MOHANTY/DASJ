name: Reusable Post‑Deploy Approval

on: []

jobs:
  post_deploy_approval:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Wait for checklist approval
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'post_deploy_check.yml',
                status: 'completed'
            });
            if (runs.total_count === 0) {
                core.setFailed('Checklist workflow has not run');
            }
