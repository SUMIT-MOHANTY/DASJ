name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build with App Insights key
        env:
          REACT_APP_APPINSIGHTS_KEY: PLACEHOLDER-INSTRUMENTATION-KEY
        run: npm run build
        working-directory: frontend
