name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run backend unit tests (placeholder)
        working-directory: backend
        run: echo "No tests yet"
      - name: Run frontend build
        working-directory: frontend
        run: npm run build
      - name: OWASP ZAP Scan (placeholder)
        run: |
          echo "ZAP scan would run here using provided config files"
          # Example: docker run -t owasp/zap2docker-stable zap-baseline.py -t http://localhost:3000 -r zap_report.html
