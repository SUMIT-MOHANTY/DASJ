name: Security Scan\n\non:\n  push:\n    branches: [ main ]\n  workflow_dispatch:\n\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v3\n      - name: Set up Python 3.11\n        uses: actions/setup-python@v4\n        with:\n          python-version: "3.11"\n      - name: Install mock ZAP\n        run: |\n          echo "Installing ZAP (mock)..."\n          # In real scenario, install ZAP here\n      - name: Export STATIC_SITE_URL\n        run: echo "STATIC_SITE_URL=https://placeholder-static-site.example.com" >> $GITHUB_ENV\n      - name: Run security scan\n        run: chmod +x scripts/security/run_scan.sh && scripts/security/run_scan.sh\n      - name: Analyze scan results\n        run: python scripts/security/analyze_scan.py\n      - name: Upload security reports\n        uses: actions/upload-artifact@v3\n        with:\n          name: security-reports\n          path: reports/security\n