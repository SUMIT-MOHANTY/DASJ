name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # -------- Frontend steps --------
      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: ./frontend
        run: npx eslint .
      - name: Test Frontend
        working-directory: ./frontend
        run: npx jest --ci
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # -------- Backend steps --------
      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Lint Backend
        working-directory: ./backend
        run: npx eslint .
      - name: Test Backend
        working-directory: ./backend
        run: npx jest --ci

      # -------- Deploy to Azure Static Web Apps --------
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "frontend/build"
          api_location: "backend"

# Placeholder notes:
#   - Set Azure credentials in repository secrets:
#       AZURE_SUBSCRIPTION_ID, RESOURCE_GROUP, STATIC_WEB_APP_NAME
#   - Azure Static Web Apps manages TLS automatically.
