name: Post‑Deployment Checklist

on:
  push:
    branches: [main]

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify checklist exists
        id: check
        run: |
          if [ -f docs/POST_DEPLOYMENT_CHECKLIST.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload checklist artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-checklist
          path: docs/POST_DEPLOYMENT_CHECKLIST.md

      - name: Manual approval
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/manual-approval@v2
        with:
          timeout-minutes: 60
          reviewers: "team-leads"

      - name: Complete
        run: echo "Post‑deployment checklist approved."
