name: Production Validation\non:\n  workflow_run:\n    workflows: ["Deploy Production"]\n    types: [completed]\njobs:\n  validation:\n    if: ${{ github.event.workflow_run.conclusion == 'success' }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Set PROD_URL env\n        run: echo "PROD_URL=${{ github.event.workflow_run.outputs.deployment_url }}" >> $GITHUB_ENV\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '18'\n      - name: Install dependencies\n        run: npm ci\n      - name: Run validation script\n        run: node scripts/validate_prod.js\n      - name: Upload validation result\n        uses: actions/upload-artifact@v4\n        with:\n          name: validation-result\n          path: validation_result.json\n      - name: Fail if validation failed\n        run: |\n          node -e "const r=require('./validation_result.json'); process.exit(r.passed?0:1);"\n        continue-on-error: false\n