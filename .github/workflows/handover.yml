name: Handover\non:\n  push:\n    branches: [main]\njobs:\n  package-docs:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - name: Archive docs\n        uses: actions/upload-artifact@v3\n        with:\n          name: handover-docs\n          path: docs/\n      - name: Comment on PR\n        if: github.event_name == 'pull_request'\n        uses: thollander/actions-comment-pull-request@v2\n        with:\n          message: 'Handover docs are archived as artifact. Download from the workflow run.'\n