name: Lint & Accessibility
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
jobs:
  lint_and_a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: HTML lint
        run: npx htmlhint "./frontend/**/*.html"
      - name: Build site
        run: npm run build
      - name: Accessibility scan
        uses: @axe-core/github-action@v1
        with:
          directory: ./frontend/dist
