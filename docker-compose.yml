version: '3.8'
services:
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    ports:
      - '4000:4000'
    depends_on: []
  frontend:
    build: ./frontend
    ports:
      - '80:80'
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api

      - "3000:3000"
    env_file: .env.example
    ports:
      - '5000:5000'
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - '3000:3000'
    depends_on:
      - backend
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tasksdb}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tasksdb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - '5000:5000'
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
volumes:
  pgdata:
