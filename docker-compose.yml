version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_name
    ports:
      - '5432:5432'
  backend:
    build: ./backend
    env_file:
      - .env.example
    depends_on:
      - db
    ports:
      - '5000:5000'
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
